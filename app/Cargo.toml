[package]
name = "fg-factory-setup"
version = "0.5.0"
edition = "2024"
description = "Configura os runners do FG Factory numa máquina: macOS, Linux ou Windows com WSL."
license = "MIT"
publish = false

[[bin]]
name = "fg-factory-setup"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

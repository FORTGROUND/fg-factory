# Liga este repositório à factory: cada issue aberta pelo FG Tracker vira uma tentativa de
# correção num runner `factory`. Copie para .github/workflows/factory.yml e ajuste `setup` e
# `validate`. O disparo automático só vale com a variável do repositório FACTORY_AUTO=true;
# sem ela, só o disparo manual (Actions → Factory → Run workflow) roda.
#
# Quando a factory deixa uma issue para uma pessoa (label fg-factory:needs-human), a resposta dela
# devolve a issue à factory: um comentário na issue, de quem tem escrita no repositório, ou a
# resposta dada no painel do FG Tracker. Com FACTORY_AUTO desligado a resposta só tira o label e
# devolve a issue à fila, sem abrir sessão.
name: Factory

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Número da issue
        required: true
        type: number
      # Só para o disparo manual. Vazio usa o que está em `with:` mais abaixo.
      agent:
        description: Quem corrige - claude ou codex (configurado = o que a máquina declara)
        type: choice
        options: [configurado, claude, codex]
        default: configurado
      model:
        description: Modelo do Claude Code (vazio = o configurado)
        type: string
        default: ''
      effort:
        description: Raciocínio
        type: choice
        options: [configurado, low, medium, high, xhigh, max]
        default: configurado
      fast:
        description: Modo rápido (cobra mais por token)
        type: boolean
        default: false
      codex_model:
        description: Modelo do Codex (vazio = o configurado)
        type: string
        default: ''
      codex_effort:
        description: Raciocínio do Codex (vazio = o configurado)
        type: string
        default: ''
      review_agent:
        description: Quem revisa - claude ou codex (configurado = o que a máquina declara)
        type: choice
        options: [configurado, claude, codex]
        default: configurado
      review_model:
        description: Revisor - modelo (vazio = o configurado)
        type: string
        default: ''
      review_effort:
        description: Revisor - raciocínio
        type: choice
        options: [configurado, low, medium, high, xhigh, max]
        default: configurado

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  fix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.FACTORY_AUTO == 'true' && github.event_name == 'issues' && github.event.issue.user.login == 'fg-tracker[bot]') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       (contains(github.event.issue.labels.*.name, 'fg-factory:needs-human') || contains(github.event.issue.labels.*.name, 'fg-factory:ignored')) &&
       (github.event.comment.user.type != 'Bot' || github.event.comment.user.login == 'fg-tracker[bot]'))
    uses: FORTGROUND/fg-factory/.github/workflows/fix-issue.yml@v1
    with:
      issue: ${{ fromJSON(github.event.issue.number || inputs.issue) }}
      # Onde roda: runners próprios com o rótulo `factory` (padrão) ou hospedado pelo GitHub.
      # runs_on: '"ubuntu-latest"'
      # Comandos deste repositório. `validate` precisa passar para a correção ser publicada.
      setup: ''
      validate: ''
      # Uma resposta com o disparo automático desligado só devolve a issue à fila.
      reply_only: ${{ github.event_name == 'issue_comment' && vars.FACTORY_AUTO != 'true' }}
      # Qual CLI roda as sessões: claude ou codex. Vazio deixa cada máquina decidir (FACTORY_AGENT
      # no .env do runner; sem isso, claude). O Codex tem o seu modelo, raciocínio e modo rápido.
      agent: ${{ (inputs.agent != 'configurado' && inputs.agent) || '' }}
      codex_model: ${{ inputs.codex_model || '' }}
      codex_effort: ${{ inputs.codex_effort || '' }}
      # codex_fast: true
      review_agent: ${{ (inputs.review_agent != 'configurado' && inputs.review_agent) || '' }}
      # A sessão do Claude Code: modelo, raciocínio e modo rápido. O que vier do disparo manual
      # vence; depois do `||` fica o valor usado nos disparos automáticos (vazio = o padrão).
      model: ${{ inputs.model || '' }}
      effort: ${{ (inputs.effort != 'configurado' && inputs.effort) || '' }}
      fast: ${{ inputs.fast || false }}
      # O revisor independente: outra sessão lê a issue e o diff antes de publicar e pode barrar.
      # `review: false` publica sem revisão. Modelo, raciocínio e modo rápido vazios = os de cima.
      # review: false
      review_model: ${{ inputs.review_model || '' }}
      review_effort: ${{ (inputs.review_effort != 'configurado' && inputs.review_effort) || '' }}
      # review_fast: 'true'
      # Merge automático: com `true`, a factory faz o merge do PR sozinha quando a validação
      # passa, o revisor aprova e os checks do PR ficam verdes. O padrão é parar no PR aberto.
      # merge: true
      # Com o segredo do painel (abaixo), envia também o log da sessão ao FG Tracker.
      # report_logs: true
    secrets:
      # Com as credenciais guardadas no runner (README, passo 3) este bloco pode ficar sem
      # segredos gravados: os do repositório, quando existem, vencem os do runner.
      # A credencial do Claude: o token da assinatura ou a chave da API (basta uma).
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.FACTORY_CLAUDE_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.FACTORY_ANTHROPIC_API_KEY }}
      # Só para sessões no Codex pela API. Com a assinatura do ChatGPT o login fica no runner.
      OPENAI_API_KEY: ${{ secrets.FACTORY_OPENAI_API_KEY }}
      # O token do FG Tracker (modelo "FG Factory"): lê a telemetria e relata ao painel.
      FG_TRACKER_TOKEN: ${{ secrets.FACTORY_FG_TRACKER_TOKEN }}
      # Opcional: um token separado só para o painel (modelo "FG Factory (relatos)").
      FG_TRACKER_FACTORY_TOKEN: ${{ secrets.FACTORY_FG_TRACKER_PANEL_TOKEN }}
      # Opcionais: o GitHub App da factory, para correções que passam por outros repositórios.
      FACTORY_APP_ID: ${{ secrets.FACTORY_APP_ID }}
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
